; Afinado de OPcache para hosting compartido (Hostinger). Esto NO activa la extensión
; si el plan la trae apagada -- eso se hace desde hPanel (Avanzado > Configuración de
; PHP > Opciones > OPcache). Este archivo solo ajusta el comportamiento una vez que ya
; está activa.
;
; validate_timestamps=1 (no 0): el despliegue actual (deploy-hostinger.sh) no limpia la
; caché de OPcache después de un "git pull" -- con 0 el sitio seguiría sirviendo código
; viejo hasta reiniciar PHP-FPM, un bug silencioso y difícil de diagnosticar sin acceso
; SSH directo. revalidate_freq=60 igual evita revisar el disco en cada petición.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
