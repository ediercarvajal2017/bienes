<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Sin conexión · MIA</title>
    <style>
        :root { color-scheme: light dark; --fondo: #F5F7FA; --tarjeta: #fff; --texto: #1e293b; --suave: #64748b; --primario: #1F6F54; }
        @media (prefers-color-scheme: dark) { :root { --fondo: #0f151c; --tarjeta: #171f28; --texto: #e2e8f0; --suave: #94a3b8; --primario: #2f9c72; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
        main { background: var(--tarjeta); max-width: 420px; width: 100%; padding: 32px 24px; border-radius: 12px; text-align: center;
               box-shadow: 0 1px 3px rgba(0,0,0,.12); }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: var(--suave); line-height: 1.5; margin: 0 0 24px; }
        button { width: 100%; min-height: 44px; border: 0; border-radius: 8px; background: var(--primario); color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión a internet</h1>
        <p>MIA necesita conexión para mostrar y guardar la información. Revise su red y vuelva a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
